<style>
/* ═══════════════════════════════════════════════════════
   NACHTPROGRAMM — gemeinsame Gestaltung aller Fachseiten
   Konzertprogramm-Ästhetik: Tinte, Elfenbein, Messing
   ═══════════════════════════════════════════════════════ */
:root {
  --ink:      #101014;
  --graphit:  #17171d;
  --graphit2: #1e1e26;
  --linie:    rgba(236, 231, 220, 0.09);
  --linie2:   rgba(236, 231, 220, 0.18);
  --elfenbein:#ece7dc;
  --nebel:    #8f8e97;
  --messing:  #c2a15c;
  --messing2: #dfc48a;
  --gruen:    #8fa284;

  --display: 'Fraunces', Georgia, serif;
  --body:    'Inter', system-ui, sans-serif;
  --mono:    'JetBrains Mono', monospace;
}

body, html, .page-content, .wrapper, main {
  background: #101014 !important;
}
.post-header, .page-heading, header.post-header {
  display: none !important;
}

.mw-page * { box-sizing: border-box; margin: 0; padding: 0; }

.mw-page {
  background: var(--ink);
  color: var(--elfenbein);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 120px;
}
.mw-page h1, .mw-page h2, .mw-page h3, .mw-page h4, .mw-page h5, .mw-page h6 {
  color: var(--elfenbein);
}

.mw-wrap { max-width: 1060px; margin: 0 auto; padding: 0 28px; }

/* ─── Hero ─── */
.mw-hero {
  padding: 96px 0 72px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 48px;
  align-items: end;
  border-bottom: 1px solid var(--linie2);
}
.mw-eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--messing);
  margin-bottom: 20px;
}
.mw-hero h1 {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(52px, 8vw, 92px);
  line-height: 0.98;
  letter-spacing: -0.02em;
}
.mw-hero h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--messing2);
}
.mw-hero-sub {
  margin-top: 22px;
  max-width: 46ch;
  color: var(--nebel);
  font-size: 16px;
}

/* Fortschrittsbogen */
.mw-progress { text-align: center; }
.mw-ring { width: 120px; height: 120px; }
.mw-ring circle { fill: none; stroke-width: 3; }
.mw-ring .bg { stroke: var(--linie2); }
.mw-ring .fg {
  stroke: var(--messing);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset 600ms cubic-bezier(0.4,0,0.2,1);
}
.mw-ring-label {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 300;
  fill: var(--elfenbein);
}
.mw-ring-caption {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--nebel);
}

/* ─── Statuskennzeichen im Seitenkopf (statt Fortschrittsbogen) ─── */
.mw-status {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--nebel);
  border: 1px solid var(--linie2);
  border-radius: 999px;
  padding: 9px 18px;
  white-space: nowrap;
}

/* ─── Hervorgehobener Block (z. B. Gesamtskript) ─── */
.mw-feature {
  margin: 56px 0 24px;
  padding: 30px 34px;
  background: linear-gradient(120deg, var(--graphit2), var(--graphit));
  border: 1px solid var(--linie2);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}
.mw-feature-titel h3 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 26px;
  letter-spacing: -0.01em;
}
.mw-feature-titel p { color: var(--nebel); font-size: 14px; margin-top: 6px; max-width: 52ch; }
.mw-feature .mw-btn { margin-left: auto; }

/* ─── Wochenplan ─── */
.mw-plan { padding: 56px 0 8px; }
.mw-plan-kopf {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}
.mw-plan-kopf h3 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  letter-spacing: -0.005em;
  margin-bottom: 8px;
}
.mw-plan-kopf p { color: var(--nebel); font-size: 13.5px; }
.mw-plan-kopf .mw-btn { flex-shrink: 0; margin-top: 2px; }
.mw-plan-wrap {
  overflow-x: auto;
  border: 1px solid var(--linie2);
  border-radius: 8px;
}
.mw-plan-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
.mw-plan-table th {
  text-align: left;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--nebel);
  padding: 12px 16px;
  border-bottom: 1px solid var(--linie2);
  white-space: nowrap;
}
.mw-plan-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--linie);
  vertical-align: top;
  line-height: 1.5;
}
.mw-plan-table tr:last-child td { border-bottom: none; }
.mw-plan-table td:first-child, .mw-plan-table th:first-child {
  font-family: var(--mono);
  color: var(--nebel);
  white-space: nowrap;
}
.mw-plan-table td:nth-child(2) { white-space: nowrap; color: var(--nebel); }
.mw-plan-table tr.frei td { color: var(--nebel); font-style: italic; }
.mw-plan-table tr.klausur td { color: var(--messing2); }
.mw-plan-table tr.klausur strong { color: var(--messing); }

/* ─── Kapitel ─── */
.mw-kapitel { padding: 72px 0 12px; }
.mw-kapitel-kopf {
  display: flex;
  align-items: baseline;
  gap: 22px;
  margin-bottom: 34px;
}
.mw-numeral {
  font-family: var(--display);
  font-style: italic;
  font-weight: 300;
  font-size: 44px;
  color: var(--messing);
  min-width: 64px;
}
.mw-kapitel-kopf h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 32px;
  letter-spacing: -0.01em;
}
.mw-kapitel-kopf .mw-meta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--nebel);
  margin-left: auto;
  white-space: nowrap;
}

/* ─── Leerer Zustand ─── */
.mw-leer {
  padding: 20px 8px 8px;
  border-top: 1px solid var(--linie);
  color: var(--nebel);
  font-size: 14px;
  font-style: italic;
}

/* ─── Modulzeilen (Tracklist) ─── */
.mw-liste { border-top: 1px solid var(--linie); }
.mw-modul {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 20px;
  align-items: center;
  padding: 20px 8px;
  border-bottom: 1px solid var(--linie);
  transition: background 180ms ease, padding 180ms ease;
}
.mw-modul:hover { background: rgba(236,231,220,0.025); padding-left: 16px; }
.mw-nr {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--nebel);
  transition: color 180ms;
}
.mw-modul:hover .mw-nr { color: var(--messing); }
.mw-modul.done .mw-nr { color: var(--gruen); }
.mw-modul h4 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 19px;
  letter-spacing: 0.005em;
}
.mw-modul.done h4 { color: var(--nebel); }
.mw-desc { color: var(--nebel); font-size: 13.5px; margin-top: 3px; }

/* Aktionen */
.mw-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.mw-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--body);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--elfenbein);
  background: transparent;
  border: 1px solid var(--linie2);
  border-radius: 999px;
  padding: 7px 15px;
  cursor: pointer;
  text-decoration: none;
  transition: all 160ms ease;
  white-space: nowrap;
}
.mw-btn:hover { border-color: var(--messing); color: var(--messing2); }
.mw-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.mw-btn--voll {
  background: var(--messing);
  border-color: var(--messing);
  color: var(--ink);
}
.mw-btn--voll:hover { background: var(--messing2); border-color: var(--messing2); color: var(--ink); }

/* Haken */
.mw-check {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--linie2);
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 200ms ease;
  margin-left: 6px;
  flex-shrink: 0;
}
.mw-check svg { width: 13px; height: 13px; stroke: var(--ink); opacity: 0; transform: scale(0.4); transition: all 260ms cubic-bezier(0.34,1.56,0.64,1); }
.mw-check:hover { border-color: var(--gruen); }
.mw-modul.done .mw-check { background: var(--gruen); border-color: var(--gruen); }
.mw-modul.done .mw-check svg { opacity: 1; transform: scale(1); }

/* ─── Mini-Player ─── */
.mw-player {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translate(-50%, 140%);
  width: min(680px, calc(100% - 32px));
  background: rgba(30, 30, 38, 0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--linie2);
  border-radius: 14px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 50;
}
.mw-player.offen { transform: translate(-50%, 0); }
.mw-play {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--messing);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 160ms;
}
.mw-play:hover { background: var(--messing2); }
.mw-play svg { width: 15px; height: 15px; fill: var(--ink); }
.mw-player-info { flex: 1; min-width: 0; }
.mw-player-info .laeuft {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--messing);
}
.mw-player-info .titel {
  font-family: var(--display);
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.mw-player-bar {
  height: 3px;
  background: var(--linie2);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.mw-player-bar > div {
  height: 100%;
  width: 0%;
  background: var(--messing);
  border-radius: 2px;
}
.mw-player-close {
  background: none; border: none;
  color: var(--nebel);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 6px;
  transition: color 160ms;
}
.mw-player-close:hover { color: var(--elfenbein); }

/* ─── Fußzeile ─── */
.mw-fuss {
  margin-top: 88px;
  padding: 36px 0;
  border-top: 1px solid var(--linie2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  color: var(--nebel);
  font-size: 13px;
}
.mw-fuss-links { display: flex; gap: 10px; }

/* ─── Responsiv ─── */
@media (max-width: 760px) {
  .mw-hero { grid-template-columns: 1fr; gap: 36px; padding: 64px 0 48px; }
  .mw-plan-kopf { flex-direction: column; }
  .mw-progress { text-align: left; }
  .mw-modul { grid-template-columns: 40px 1fr; }
  .mw-actions { grid-column: 1 / -1; padding-left: 60px; flex-wrap: wrap; justify-content: flex-start; }
  .mw-feature .mw-btn { margin-left: 0; }
  .mw-kapitel-kopf .mw-meta { display: none; }
}
@media (max-width: 760px) { .mw-actions { padding-left: 0; } }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; animation: none !important; }
  html { scroll-behavior: auto; }
}
</style>
