<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "de" }}">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <script>
      /* Hell oder dunkel vor dem ersten Zeichnen festlegen, damit nichts aufblitzt:
         gespeicherte Wahl, sonst die Einstellung des Geräts. */
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    {%- seo -%}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}
  </head>

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script>
      (function () {
        var btn = document.querySelector('.theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        function zeige() {
          var hell = root.getAttribute('data-theme') === 'light';
          var text = hell ? 'Dunkles Design einschalten' : 'Helles Design einschalten';
          btn.setAttribute('aria-label', text);
          btn.setAttribute('title', text);
        }
        btn.addEventListener('click', function () {
          var neu = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          root.setAttribute('data-theme', neu);
          try { localStorage.setItem('theme', neu); } catch (e) {}
          zeige();
        });
        zeige();
      })();
    </script>

  </body>

</html>
