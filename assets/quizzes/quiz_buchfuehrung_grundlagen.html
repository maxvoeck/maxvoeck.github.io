<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Grundlagen der Buchführung – BWL Block 10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center
}
.quiz-container{
    background:#fff;
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-width:820px;
    width:100%;
    overflow:hidden
}
.quiz-header{
    background:linear-gradient(135deg,#374151 0%,#1f2937 100%);
    color:#fff;
    padding:2rem;
    text-align:center
}
.quiz-header h1{font-size:1.8rem;margin-bottom:.5rem}
.quiz-header p{opacity:.9;font-size:1rem}
.progress-bar{background:#e0e0e0;height:8px;position:relative}
.progress-fill{
    background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);
    height:100%;width:0%;transition:width .3s ease
}
.quiz-content{padding:2rem}
.question-container{display:none}
.question-container.active{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
}
.question-number{
    color:#667eea;font-weight:600;font-size:.9rem;margin-bottom:.5rem
}
.question-text{
    font-size:1.28rem;font-weight:600;color:#1f2937;
    margin-bottom:1.5rem;line-height:1.5
}
.options{display:flex;flex-direction:column;gap:1rem}
.option{
    width:100%;font:inherit;text-align:left;color:#1f2937;
    background:#f8f9fa;border:2px solid #e0e0e0;border-radius:12px;
    padding:1rem 1.5rem;cursor:pointer;transition:all .25s ease;
    display:flex;align-items:center;gap:1rem
}
.option:hover{
    background:#f0f1f3;border-color:#667eea;transform:translateX(5px)
}
.option-letter{
    background:#667eea;color:#fff;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0
}
.option.selected{background:#e8eaf6;border-color:#667eea}
.option.correct{background:#d4edda;border-color:#28a745}
.option.correct .option-letter{background:#28a745}
.option.incorrect{background:#f8d7da;border-color:#dc3545}
.option.incorrect .option-letter{background:#dc3545}
.option.disabled{cursor:not-allowed;opacity:.74}
.option:focus-visible,.btn:focus-visible{outline:3px solid #1f2937;outline-offset:2px}
.feedback{
    margin-top:1.5rem;padding:1rem;border-radius:8px;display:none;line-height:1.45
}
.feedback.show{display:block;animation:fadeIn .4s ease}
.feedback.correct{background:#d4edda;border-left:4px solid #28a745;color:#155724}
.feedback.incorrect{background:#f8d7da;border-left:4px solid #dc3545;color:#721c24}
.feedback-title{font-weight:700;margin-bottom:.45rem}
.controls{
    margin-top:2rem;display:flex;justify-content:space-between;gap:1rem
}
.btn{
    padding:.8rem 2rem;border:none;border-radius:8px;font-size:1rem;
    font-weight:600;cursor:pointer;transition:all .25s ease
}
.btn-primary{
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff
}
.btn-primary:hover:not(:disabled){
    transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.results-container{display:none;text-align:center;padding:2rem}
.results-container.show{display:block;animation:fadeIn .45s ease}
.score-circle{
    width:200px;height:200px;border-radius:50%;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:2rem auto;color:#fff;box-shadow:0 10px 30px rgba(102,126,234,.4)
}
.score-number{font-size:3rem;font-weight:700}
.score-label{font-size:1rem;opacity:.9}
.result-message{font-size:1.45rem;font-weight:600;color:#1f2937;margin-bottom:1rem}
.result-details{
    background:#f8f9fa;border-radius:12px;padding:1.5rem;margin:2rem 0;
    display:flex;justify-content:space-around;flex-wrap:wrap;gap:1rem
}
.result-stat{text-align:center}
.result-stat-number{font-size:2rem;font-weight:700;color:#667eea}
.result-stat-label{font-size:.9rem;color:#666;margin-top:.3rem}
.small-note{font-size:.9rem;color:#6b7280;margin-top:.8rem;line-height:1.4}
@media(max-width:768px){
    body{padding:10px}
    .quiz-header h1{font-size:1.4rem}
    .question-text{font-size:1.1rem}
    .controls{flex-direction:column}
    .btn{width:100%}
}
</style>
</head>
<body>
<div class="quiz-container">
    <div class="quiz-header">
        <h1>📘 Grundlagen der Buchführung</h1>
        <p>Rechnungswesen, Buchführungspflicht und Belege · BWL · W-Kurs · Block 10</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" role="progressbar" aria-label="Gemeisterte Fragen" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"></div>
    </div>

    <div class="quiz-content">
        <div id="questionsContainer"></div>

        <div class="results-container" id="resultsContainer">
            <div class="result-message" id="resultMessage"></div>
            <div class="score-circle">
                <div class="score-number" id="scoreNumber">0%</div>
                <div class="score-label">Erreicht</div>
            </div>
            <div class="result-details">
                <div class="result-stat">
                    <div class="result-stat-number" id="correctCount">0</div>
                    <div class="result-stat-label">Beim ersten Versuch richtig</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-number" id="incorrectCount">0</div>
                    <div class="result-stat-label">Zusätzliche Versuche</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-number" id="totalCount">0</div>
                    <div class="result-stat-label">Versuche gesamt</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Quiz wiederholen</button>
        </div>
    </div>
</div>

<script>
const quizData = [
  {
    "question": "Wozu dient das Rechnungswesen?",
    "options": [
      "Es erfasst Zahlen über das Unternehmen und liefert Informationen.",
      "Es berechnet nur die Umsatzsteuer.",
      "Es ersetzt alle Entscheidungen der Geschäftsführung.",
      "Es erfasst nur private Ausgaben der Beschäftigten."
    ],
    "correct": 0,
    "explanation": "Das Rechnungswesen dokumentiert betriebliche Vorgänge und hilft bei Information, Planung und Kontrolle."
  },
  {
    "question": "Wer nutzt vor allem das interne Rechnungswesen?",
    "options": [
      "Die Geschäftsführung bei einer Kostenentscheidung",
      "Ein externer Eigentümer beim Lesen des Abschlusses",
      "Eine Bank bei der Kreditprüfung",
      "Das Finanzamt bei der Besteuerung"
    ],
    "correct": 0,
    "explanation": "Interne Zahlen helfen der Geschäftsführung bei Entscheidungen im Betrieb."
  },
  {
    "question": "Welche Information gehört vor allem zum externen Rechnungswesen?",
    "options": [
      "Kosten je produziertem Stück",
      "Geplante Kosten einer Werbeaktion",
      "Eine interne Preisentscheidung",
      "Der Jahresabschluss für eine Bank"
    ],
    "correct": 3,
    "explanation": "Der Jahresabschluss informiert auch Personen außerhalb des Unternehmens."
  },
  {
    "question": "Welches Teilgebiet berechnet zum Beispiel die Kosten eines Produkts?",
    "options": [
      "Handelsregister",
      "Kosten- und Leistungsrechnung (KLR)",
      "Jahresabschluss",
      "Buchführung"
    ],
    "correct": 1,
    "explanation": "Die KLR gehört zum internen Rechnungswesen und berechnet betriebliche Kosten."
  },
  {
    "question": "Welche Aussage zur Buchführung trifft zu?",
    "options": [
      "Sie ist nur für Banken bestimmt.",
      "Sie ist mit der KLR identisch.",
      "Sie erfasst ausschließlich geplante Ausgaben.",
      "Sie gehört zum externen Rechnungswesen und erfasst Geschäftsvorfälle."
    ],
    "correct": 3,
    "explanation": "Die Buchführung erfasst Geschäftsvorfälle und liefert Zahlen für den Jahresabschluss."
  },
  {
    "question": "Was ist ein Geschäftsvorfall?",
    "options": [
      "Nur ein Vorgang am Jahresende",
      "Nur ein Vorgang mit Bargeld",
      "Ein Vorgang, der Vermögen, Schulden oder Erfolg verändert und in Geld ausgedrückt werden kann",
      "Jedes Gespräch über eine künftige Anschaffung"
    ],
    "correct": 2,
    "explanation": "Geschäftsvorfälle verändern die wirtschaftliche Lage und sind in Geld messbar."
  },
  {
    "question": "Welche Situation ist noch kein Geschäftsvorfall der Buchführung?",
    "options": [
      "Der Kauf einer Maschine",
      "Ein unverbindlich geplantes Bankgespräch",
      "Die Zahlung einer Rechnung",
      "Der Verkauf von Waren auf Rechnung"
    ],
    "correct": 1,
    "explanation": "Ein geplantes Gespräch allein verändert noch keine Vermögenswerte, Schulden oder den Erfolg."
  },
  {
    "question": "Ein Unternehmen kauft einen Lieferwagen gegen sofortige Bankzahlung. Was ist sicher richtig?",
    "options": [
      "Die Zusammensetzung des Vermögens verändert sich.",
      "Das Gesamtvermögen steigt um den Kaufpreis.",
      "Die Zahlung ist kein Geschäftsvorfall.",
      "Der Jahresüberschuss steigt automatisch."
    ],
    "correct": 0,
    "explanation": "Das Fahrzeug kommt hinzu, Bankguthaben nimmt ab. Die Vermögenssumme muss deshalb nicht steigen."
  },
  {
    "question": "Welcher Beleg weist eine Zahlung per Bank nach?",
    "options": [
      "Werbeprospekt",
      "Preisliste",
      "Dienstplan",
      "Kontoauszug"
    ],
    "correct": 3,
    "explanation": "Der Kontoauszug dokumentiert die Bankzahlung."
  },
  {
    "question": "Wie heißt eine Rechnung, die ein Unternehmen von einem Lieferanten erhält?",
    "options": [
      "Jahresabschluss",
      "Kontoauszug",
      "Eingangsrechnung",
      "Ausgangsrechnung"
    ],
    "correct": 2,
    "explanation": "Eine vom Lieferanten erhaltene Rechnung ist eine Eingangsrechnung."
  },
  {
    "question": "Welche Grundregel gilt für Buchungen?",
    "options": [
      "Belege sind nur bei großen Beträgen nötig.",
      "Nur Barzahlungen werden gebucht.",
      "Jede Bestellung ist sofort ein Ertrag.",
      "Keine Buchung ohne Beleg."
    ],
    "correct": 3,
    "explanation": "Ein Beleg macht den Geschäftsvorfall nachprüfbar."
  },
  {
    "question": "Wer muss nach § 238 HGB grundsätzlich Bücher führen?",
    "options": [
      "Jede Privatperson",
      "Nur Aktiengesellschaften",
      "Kaufleute",
      "Nur Unternehmen mit mehr als 800.000 € Umsatz"
    ],
    "correct": 2,
    "explanation": "§ 238 HGB enthält die Grundregel zur Buchführungspflicht der Kaufleute."
  },
  {
    "question": "Eine neue GmbH erzielt nur 50.000 € Umsatz. Was gilt?",
    "options": [
      "Sie ist nach § 241a HGB befreit.",
      "Sie muss als Handelsgesellschaft Bücher führen.",
      "Sie muss erst ab 800.000 € Umsatz Bücher führen.",
      "Sie führt nur dann Bücher, wenn die Bank es verlangt."
    ],
    "correct": 1,
    "explanation": "Die Befreiung des § 241a HGB gilt für Einzelkaufleute, nicht für die GmbH."
  },
  {
    "question": "Für wen kann die Befreiung nach § 241a HGB gelten?",
    "options": [
      "Für alle Privatpersonen",
      "Für jede GmbH",
      "Für jede Bank",
      "Für Einzelkaufleute"
    ],
    "correct": 3,
    "explanation": "§ 241a HGB nennt ausdrücklich Einzelkaufleute."
  },
  {
    "question": "Welche beiden Grenzen nennt § 241a HGB?",
    "options": [
      "80.000 € Umsatz und 800.000 € Jahresüberschuss",
      "800.000 € Bankguthaben und 80.000 € Schulden",
      "600.000 € Umsatz und 60.000 € Jahresüberschuss",
      "800.000 € Umsatzerlöse und 80.000 € Jahresüberschuss"
    ],
    "correct": 3,
    "explanation": "Für die Befreiung sind höchstens 800.000 € Umsatzerlöse und höchstens 80.000 € Jahresüberschuss maßgeblich."
  },
  {
    "question": "Wie lange müssen bei einem bestehenden Einzelkaufmann beide Grenzen nach § 241a HGB eingehalten sein?",
    "options": [
      "Nur am Tag der Anmeldung",
      "An zwei aufeinanderfolgenden Abschlussstichtagen",
      "Nur in einem beliebigen Monat",
      "Erst nach fünf Jahren"
    ],
    "correct": 1,
    "explanation": "Bei einem bestehenden Einzelkaufmann zählen zwei aufeinanderfolgende Abschlussstichtage."
  },
  {
    "question": "Eine Einzelkauffrau hat in zwei Jahren jeweils 420.000 € Umsatz und 95.000 € Jahresüberschuss. Was folgt?",
    "options": [
      "Die Befreiung nach § 241a HGB greift nicht, weil eine Grenze überschritten ist.",
      "Sie ist befreit, weil nur das erste Jahr zählt.",
      "Sie ist befreit, weil der Umsatz unter 800.000 € liegt.",
      "Sie ist wegen der Rechtsform immer befreit."
    ],
    "correct": 0,
    "explanation": "Beide Grenzen müssen eingehalten sein. 95.000 € überschreiten die Grenze für den Jahresüberschuss."
  },
  {
    "question": "Was bedeutet die Befreiung von der handelsrechtlichen Buchführungspflicht für kleine Einzelkaufleute?",
    "options": [
      "Sie müssen überhaupt nichts aufzeichnen.",
      "Sie sind automatisch von allen Steuern befreit.",
      "Steuerliche Aufzeichnungen bleiben in der Regel nötig.",
      "Sie dürfen keine Rechnungen mehr schreiben."
    ],
    "correct": 2,
    "explanation": "Die Befreiung nach HGB bedeutet nicht, dass keine steuerlichen Aufzeichnungen erforderlich sind."
  },
  {
    "question": "Was bedeutet „vollständig“ bei der Buchführung?",
    "options": [
      "Nur hohe Beträge werden erfasst.",
      "Kein Geschäftsvorfall darf fehlen.",
      "Alle Beträge müssen gerundet werden.",
      "Nur Bankzahlungen werden erfasst."
    ],
    "correct": 1,
    "explanation": "Ein nicht erfasster Barverkauf verletzt die Vollständigkeit."
  },
  {
    "question": "Eine Zahlung über 200 € wird als 2.000 € eingetragen. Welche Regel ist verletzt?",
    "options": [
      "Die Richtigkeit",
      "Die Buchführungspflicht der GmbH",
      "Die Unterscheidung intern/extern",
      "Die Frist für Handelsbriefe"
    ],
    "correct": 0,
    "explanation": "Der erfasste Betrag stimmt nicht mit dem tatsächlichen Geschäftsvorfall überein."
  },
  {
    "question": "Ein Einkauf wird ohne Rechnung oder anderen Beleg gebucht. Was ist das Problem?",
    "options": [
      "Die GmbH wird dadurch zum Einzelkaufmann.",
      "Die Buchung ist nicht ausreichend nachprüfbar.",
      "Der Einkauf ist automatisch ein Umsatz.",
      "Die Aufbewahrungsfrist wird kürzer."
    ],
    "correct": 1,
    "explanation": "Ohne Beleg lässt sich der Vorgang nicht ausreichend nachweisen."
  },
  {
    "question": "Eine alte Buchung wird unleserlich überschrieben. Welche Aussage passt?",
    "options": [
      "Das ist immer nötig, wenn ein Fehler passiert.",
      "Es reicht, wenn nur die neue Zahl zu sehen ist.",
      "Änderungen müssen erkennbar bleiben; Überschreiben ist unzulässig.",
      "Das betrifft nur die KLR."
    ],
    "correct": 2,
    "explanation": "Eine Berichtigung muss nachvollziehbar bleiben. Alte Eintragungen dürfen nicht unleserlich gemacht werden."
  },
  {
    "question": "Wie lange sind Buchungsbelege nach § 257 HGB grundsätzlich aufzubewahren?",
    "options": [
      "2 Jahre",
      "10 Jahre",
      "6 Jahre",
      "8 Jahre"
    ],
    "correct": 3,
    "explanation": "Für Buchungsbelege gilt grundsätzlich eine Aufbewahrungsfrist von acht Jahren."
  },
  {
    "question": "Welche Reihenfolge hilft bei einer Begründung im Klausurfall?",
    "options": [
      "Zuerst eine neue Theorie erfinden",
      "Fallinformation ignorieren",
      "Nur Ergebnis nennen",
      "Merkmal, Fallinformation, Schlussfolgerung"
    ],
    "correct": 3,
    "explanation": "Eine gute Fallbegründung verbindet die Regel mit den konkreten Angaben und zieht daraus das Ergebnis."
  }
];
let queue=[], index=0, attempts=0, firstCorrect=0, firstSeen=new Set(), mastered=new Set(), currentAnswered=false;
const $=id=>document.getElementById(id);
function startQuiz(){
 queue=quizData.map((_,i)=>i); index=0; attempts=0; firstCorrect=0;
 firstSeen=new Set(); mastered=new Set(); currentAnswered=false;
 $('resultsContainer').classList.remove('show'); renderQuestion();
}
function renderQuestion(){
 if(index>=queue.length){showResults();return;}
 currentAnswered=false;
 const qi=queue[index], q=quizData[qi];
 const parent=$('questionsContainer'); parent.replaceChildren();
 const wrap=document.createElement('div'); wrap.className='question-container active';
 const num=document.createElement('div'); num.className='question-number';
 num.textContent=(firstSeen.has(qi)?'🔁 Wiederholung · ':'')+'Frage '+(qi+1)+' von '+quizData.length+' · '+mastered.size+' gemeistert';
 const title=document.createElement('h2');title.className='question-text';title.textContent=q.question;
 const options=document.createElement('div');options.className='options';options.id='options-current';
 q.options.forEach((opt,i)=>{
   const button=document.createElement('button');button.type='button';button.className='option';
   const letter=document.createElement('span');letter.className='option-letter';letter.textContent='ABCD'[i];
   const label=document.createElement('span');label.className='option-text';label.textContent=opt;
   button.append(letter,label);button.addEventListener('click',()=>choose(qi,i));options.append(button);
 });
 const feedback=document.createElement('div');feedback.className='feedback';feedback.id='feedback-current';feedback.setAttribute('role','status');
 const ft=document.createElement('div');ft.className='feedback-title';
 const fb=document.createElement('div');fb.className='feedback-text';feedback.append(ft,fb);
 const controls=document.createElement('div');controls.className='controls';
 const spacer=document.createElement('div');const next=document.createElement('button');
 next.type='button';next.className='btn btn-primary';next.id='nextBtn';next.textContent='Weiter →';next.disabled=true;
 next.addEventListener('click',()=>{index++;renderQuestion();});controls.append(spacer,next);
 wrap.append(num,title,options,feedback,controls);parent.append(wrap);updateProgress();
}
function choose(qi,selected){
 if(currentAnswered)return;currentAnswered=true;attempts++;
 const q=quizData[qi], correct=selected===q.correct;
 if(!firstSeen.has(qi)){firstSeen.add(qi);if(correct)firstCorrect++;}
 if(correct)mastered.add(qi);
 else queue.push(qi);
 const buttons=[...document.querySelectorAll('#options-current .option')];
 buttons.forEach((b,i)=>{b.disabled=true;b.classList.add('disabled');if(i===q.correct)b.classList.add('correct');});
 if(!correct)buttons[selected].classList.add('incorrect');
 const feedback=$('feedback-current');feedback.classList.add('show',correct?'correct':'incorrect');
 feedback.querySelector('.feedback-title').textContent=correct?'✓ Richtig!':'✗ Noch nicht – diese Frage kommt später wieder.';
 feedback.querySelector('.feedback-text').textContent=q.explanation;
 $('nextBtn').disabled=false;updateProgress();
}
function updateProgress(){const bar=$('progressFill');bar.style.width=(mastered.size/quizData.length*100)+'%';bar.setAttribute('aria-valuenow',mastered.size);}
function showResults(){
 $('questionsContainer').replaceChildren();$('resultsContainer').classList.add('show');
 $('scoreNumber').textContent=Math.round(firstCorrect/quizData.length*100)+'%';
 $('correctCount').textContent=firstCorrect;
 $('incorrectCount').textContent=attempts-quizData.length;
 $('totalCount').textContent=attempts;
 $('resultMessage').textContent='Geschafft! '+firstCorrect+' von '+quizData.length+' Fragen beim ersten Versuch richtig.';
}
function restartQuiz(){startQuiz();}
window.addEventListener('DOMContentLoaded',startQuiz);
</script>
</body>
</html>
