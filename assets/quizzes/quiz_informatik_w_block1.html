<html lang="de">

<style>

margin: 0;

.quiz-content {

.option {
background: #f8f9fa;

padding: 1rem 1.5rem;

.option:hover {

background: #dc3545;

.feedback.show {

.feedback.incorrect {

button.option { width:100%; text-align:left; font:inherit; color:#1f2937; }
.option:focus-visible,.btn:focus-visible { outline:3px solid #374151; outline-offset:3px; }

<body>
<div class="quiz-container">
<div class="quiz-header">
<h1>💻 Was braucht eine Kasse?</h1>

<script>
const quizData = [
  {
    "question": "Was sind Daten?",

      "Angaben, die als Zahlen, Texte oder Zeichen dargestellt sind.",

    "correct": 0,
    "explanation": "Daten können Zahlen, Texte oder Zeichen sein. Auch ein Artikelname oder ein Datum gehört zu den Daten."
  },
  {
    "question": "Welche Gruppe enthält ausschließlich Daten, die auf einem Kassenbon stehen können?",
    "options": [
      "Tablet, Tastatur und Bildschirm",
      "Browser, Betriebssystem und Kassenprogramm",
      "Cappuccino, Menge 2 und Datum 05.10.2026",

    ],
    "correct": 2,
    "explanation": "Artikelname, Menge und Datum sind dargestellte Angaben. Geräte gehören zur Hardware, Programme zur Software."
  },
  {
    "question": "Auf einem Zettel steht nur „8,00“. Was können Sie sicher sagen?",
    "options": [
      "Ein Gast muss genau 8,00 Euro bezahlen.",
      "Die Angabe ist eine Zahl; ihre Bedeutung ist noch nicht eindeutig.",
      "Im Café wurden genau acht Getränke verkauft.",
      "Die Angabe ist eine Uhrzeit am Morgen."
    ],
    "correct": 1,
    "explanation": "Die Zahl ist ein Datum. Ohne Beschriftung oder weiteren Zusammenhang können wir nicht sicher erkennen, worauf sie sich bezieht."
  },
  {
    "question": "Auf dem Bon steht „Summe: 8,00 Euro“. Welche Information erhalten wir?",
    "options": [
      "Der Gast hat acht Getränke bestellt.",
      "Jedes Getränk kostet 8,00 Euro.",
      "Es wurden acht Cappuccinos verkauft.",
      "Der Gast muss insgesamt 8,00 Euro bezahlen."
    ],
    "correct": 3,
    "explanation": "Die Beschriftung „Summe“ und die Einheit Euro zeigen: 8,00 Euro ist der Gesamtbetrag der Bestellung."
  },
  {
    "question": "Auf einem Zettel steht „40“. Welche Ergänzung macht die gemeinte Warenmenge eindeutig?",
    "options": [
      "40 Packungen Arabica im Lager",
      "40 – wichtig",
      "40 – bitte prüfen",
      "40 – Elster GmbH"
    ],
    "correct": 0,
    "explanation": "Die Angabe nennt die Einheit Packungen, die Ware Arabica und den Zusammenhang Lagerbestand. „Wichtig“ oder ein Firmenname erklärt die Menge nicht."
  },
  {
    "question": "Welche Aussage über Daten und Information ist richtig?",
    "options": [
      "Verständliche Angaben sind keine Daten mehr.",
      "Daten und Information sind immer dasselbe.",
      "Wir gewinnen Information, wenn wir Daten im Zusammenhang verstehen.",
      "Daten haben in jedem Zusammenhang dieselbe Bedeutung."
    ],
    "correct": 2,
    "explanation": "Auch ein beschrifteter Bon enthält Daten. Beim Verstehen dieser Angaben gewinnen wir Information."
  },
  {
    "question": "Welche Angabe hilft am besten, die Zahl „40“ als Gewicht zu verstehen?",
    "options": [
      "Die Angabe wurde mit einem Tablet erfasst.",
      "Neben der Zahl steht „Gewicht in Kilogramm“.",
      "Die Zahl ist in großer Schrift gedruckt.",
      "Die Angabe steht auf einem weißen Zettel."
    ],
    "correct": 1,
    "explanation": "Eine Beschriftung mit Größe und Einheit erklärt, worauf sich die Zahl bezieht. Schriftgröße und Papierfarbe machen diese Bedeutung nicht eindeutig."
  },
  {
    "question": "Auf einem Zettel steht „40 · 06.10. · Arabica“. Welche Aussage verwendet alle drei Angaben in einem möglichen Zusammenhang?",
    "options": [
      "Arabica ist eine Kaffeesorte.",
      "Eine Packung Arabica kostet 40 Euro.",
      "Am 6. Oktober öffnet das Café.",
      "Am 6. Oktober wurden 40 Packungen Arabica geliefert."
    ],
    "correct": 3,
    "explanation": "Der Satz verbindet Datum, Menge und Ware zu einer möglichen Information. Dass genau diese Deutung gemeint ist, müsste eine Beschriftung bestätigen."
  },
  {
    "question": "Was ist Hardware?",
    "options": [
      "Programme, die einen Computer steuern.",
      "Informationen über verkaufte Artikel.",
      "Körperliche Geräte und Bauteile eines Computersystems.",
      "Anweisungen, mit denen ein Preis berechnet wird."
    ],
    "correct": 2,
    "explanation": "Hardware sind körperliche Geräte und Bauteile. Dazu gehören zum Beispiel Tablet, Bildschirm, Prozessor und Drucker."
  },
  {
    "question": "Welche Gruppe besteht ausschließlich aus Hardware?",
    "options": [
      "Tablet, Tastatur und Bondrucker",
      "Tablet, Browser und Bondrucker",
      "Betriebssystem, Tastatur und Browser",
      "Kassenprogramm, Bildschirm und Tablet"
    ],
    "correct": 0,
    "explanation": "Tablet, Tastatur und Bondrucker sind Geräte. Browser, Betriebssystem und Kassenprogramm sind Programme und damit Software."
  },
  {
    "question": "Warum ist der Bondrucker Hardware?",
    "options": [
      "Weil er den Preis eines Getränks kennt.",
      "Weil er ein körperliches Gerät ist.",
      "Weil er zur Ausstattung des Cafés gehört.",
      "Weil er den Text auf dem Bon versteht."
    ],
    "correct": 1,
    "explanation": "Das entscheidende Merkmal ist: Der Bondrucker ist ein körperliches Gerät. Zur Kasse gehören auch Software und Daten; die Zugehörigkeit allein reicht nicht als Begründung."
  },
  {
    "question": "Ein Prozessor befindet sich im Inneren des Tablets. Welche Zuordnung ist richtig?",
    "options": [
      "Software, weil man ihn im Betrieb nicht sieht.",
      "Daten, weil er Zahlen verarbeitet.",
      "Information, weil er Ergebnisse liefert.",
      "Hardware, weil er ein körperliches Bauteil ist."
    ],
    "correct": 3,
    "explanation": "Auch Bauteile im Inneren eines Geräts sind Hardware. Sichtbarkeit und die Verarbeitung von Daten ändern diese Zuordnung nicht."
  },
  {
    "question": "Was ist Software?",
    "options": [
      "Alle Geräte, die an die Kasse angeschlossen sind.",
      "Alle Artikel und Preise, die auf einem Bon stehen.",
      "Programme mit Anweisungen, die festlegen, was der Computer tut.",
      "Alle Ergebnisse, die eine Person aus einem Bon versteht."
    ],
    "correct": 2,
    "explanation": "Software umfasst Programme. Ihre Anweisungen legen fest, wie ein Computer arbeitet und Daten verarbeitet."
  },
  {
    "question": "Welche Gruppe besteht ausschließlich aus Software?",
    "options": [
      "Kassenprogramm, Betriebssystem und Browser",
      "Kassenprogramm, Bildschirm und Browser",
      "Betriebssystem, Tablet und Tastatur",
      "Browser, Bondrucker und Kassenprogramm"
    ],
    "correct": 0,
    "explanation": "Kassenprogramm, Betriebssystem und Browser sind Programme. Bildschirm, Tablet, Tastatur und Drucker sind Hardware."
  },
  {
    "question": "Welche Aufgabe hat das Betriebssystem?",
    "options": [
      "Es legt als Gerät Papier in den Drucker ein.",
      "Es verwaltet grundlegende Gerätefunktionen und ermöglicht die Ausführung von Programmen.",
      "Es gibt als Datenliste alle Getränkepreise vor.",
      "Es ersetzt die körperlichen Bauteile des Tablets."
    ],
    "correct": 1,
    "explanation": "Das Betriebssystem ist Software. Es verwaltet grundlegende Funktionen des Geräts und ermöglicht, dass Programme ausgeführt werden."
  },
  {
    "question": "Eine Mitarbeiterin berührt das Symbol des Kassenprogramms auf dem Bildschirm. Welche Aussage stimmt?",
    "options": [
      "Bildschirm und Kassenprogramm sind beide Hardware.",
      "Bildschirm und Kassenprogramm sind beide Software.",
      "Das Programm wird durch die Berührung zu Hardware.",
      "Der Bildschirm ist Hardware; das Kassenprogramm bleibt Software."
    ],
    "correct": 3,
    "explanation": "Die Berührung erfolgt auf dem körperlichen Bildschirm. Das angezeigte Programm besteht weiterhin aus Anweisungen und ist Software."
  },
  {
    "question": "Die Kasse berechnet den Preis und druckt den Bon. Wie arbeiten Hardware und Software zusammen?",
    "options": [
      "Die Hardware legt alle Rechenschritte fest; Software ist nur Papier.",
      "Software und Hardware erledigen ihre Aufgaben unabhängig voneinander.",
      "Das Programm gibt Anweisungen; die Hardware führt sie aus und gibt den Bon aus.",
      "Software ersetzt das Tablet und den Bondrucker vollständig."
    ],
    "correct": 2,
    "explanation": "Das Kassenprogramm gibt die Verarbeitung vor. Die Hardware führt die Anweisungen aus; der Drucker gibt den Bon auf Papier aus."
  },
  {
    "question": "Welche beiden getrennten Bestellungen kosten jeweils 6,00 Euro? Ein Cappuccino kostet 3,00 Euro, ein Espresso 2,00 Euro.",
    "options": [
      "Bestellung 1: zwei Cappuccinos. Bestellung 2: drei Espressos.",
      "Bestellung 1: ein Cappuccino. Bestellung 2: zwei Espressos.",
      "Bestellung 1: drei Cappuccinos. Bestellung 2: zwei Espressos.",
      "Bestellung 1: zwei Cappuccinos. Bestellung 2: zwei Espressos."
    ],
    "correct": 0,
    "explanation": "Zwei Cappuccinos kosten 2 × 3,00 = 6,00 Euro. Drei Espressos kosten 3 × 2,00 = 6,00 Euro. Ein gleicher Gesamtbetrag kann zu unterschiedlichen Artikeln und Mengen gehören."
  },
  {
    "question": "Die Kasse speichert pro Verkauf nur Datum und Gesamtbetrag. Kann die Chefin damit sicher das heute am häufigsten verkaufte Getränk bestimmen?",

      "Ja, der größte Gesamtbetrag zeigt das häufigste Getränk.",
      "Nein, es fehlen die verkauften Artikel und ihre Mengen.",

      "Nein, es fehlt nur die Nummer des Bondruckers."
    ],
    "correct": 1,
    "explanation": "Datum und Gesamtbetrag verraten nicht eindeutig, welche Getränke in welchen Mengen verkauft wurden. Unterschiedliche Bestellungen können denselben Gesamtbetrag haben."
  },
  {
    "question": "Welche Daten und welche Verarbeitung helfen, das heute am häufigsten verkaufte Getränk zu finden?",
    "options": [
      "Preise und Datum speichern; den höchsten Preis auswählen.",
      "Artikelnamen und Preise speichern; die Preise zusammenzählen.",
      "Gesamtbetrag und Kassennummer speichern; die Beträge vergleichen.",

    ],
    "correct": 3,
    "explanation": "Das Datum grenzt den Tag ein. Artikel und Menge ermöglichen, die heutigen Verkaufsmengen je Getränk zu addieren und anschließend zu vergleichen."
  }
];

let queue, currentIndex, totalAnswered, firstCorrect, mastered, attempted;
let displayedOptions = [], locked = false;
function shuffle(values) {
  const a = [...values];
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
// Fünf richtige Antworten pro Position im ersten Durchlauf,
// zufällig angeordnet, ohne Dreierfolge oder wiederholten Viererblock.
function makePositions() {
  let p;
  do {
    p=shuffle(Array.from({length:20},(_,i)=>i%4));
  } while (p.some((v,i)=>i>1&&v===p[i-1]&&v===p[i-2]) ||
    p.some((_,i)=>i>=4&&i<=16&&p.slice(i,i+4).every((v,j)=>v===p[i-4+j])));
  return p;
}
let positions;
function initQuiz() {
  queue=quizData.map((_,i)=>i); currentIndex=0; totalAnswered=0; firstCorrect=0;
  mastered=new Set(); attempted=new Set(); positions=makePositions();
  document.getElementById('resultsContainer').classList.remove('show');
  renderCurrentQuestion();
}
function renderCurrentQuestion() {
  if(currentIndex>=queue.length) { showResults(); return; }
  const id=queue[currentIndex], q=quizData[id], retry=attempted.has(id);
  const correctOption={text:q.options[q.correct],correct:true};
  displayedOptions=shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})).filter(o=>!o.correct));
  displayedOptions.splice(retry?Math.floor(Math.random()*4):positions[id],0,correctOption);
  locked=false;
  const container=document.getElementById('questionsContainer');
  container.innerHTML=`<div class="question-container active">
    <div class="question-number">${retry?'🔁 Wiederholung · ':''}Frage ${id+1} von ${quizData.length} · ${mastered.size} gemeistert</div>
    <h2 class="question-text" tabindex="-1">${q.question}</h2>
    <div class="options" id="options-current" role="group" aria-label="Antwortmöglichkeiten"></div>
    <div class="feedback" id="feedback-current" role="status" aria-live="polite">
      <div class="feedback-title"></div><div class="feedback-text"></div>
    </div>
    <div class="controls"><div></div><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Weiter →</button></div>
  </div>`;
  const options=document.getElementById('options-current');
  displayedOptions.forEach((o,i)=>{
    const button=document.createElement('button');
    button.type='button';button.className='option';
    const letter=document.createElement('span');letter.className='option-letter';letter.textContent=String.fromCharCode(65+i);
    const label=document.createElement('span');label.className='option-text';label.textContent=o.text;
    button.append(letter,label);button.addEventListener('click',()=>selectOption(i));options.append(button);
  });
  updateProgress();
  if(totalAnswered>0) container.querySelector('h2').focus();
}
function selectOption(index) {
  if(locked) return;
  locked=true;
  const id=queue[currentIndex], q=quizData[id], right=displayedOptions[index].correct;
  const buttons=document.querySelectorAll('#options-current .option');
  buttons.forEach((b,i)=>{b.disabled=true;if(displayedOptions[i].correct)b.classList.add('correct');});
  buttons[index].classList.add('selected',right?'correct':'incorrect');
  const feedback=document.getElementById('feedback-current');
  feedback.classList.add('show',right?'correct':'incorrect');
  if(right) {
    if(!attempted.has(id))firstCorrect++;
    mastered.add(id);
    feedback.querySelector('.feedback-title').textContent='✓ Richtig!';
  } else {
    queue.splice(Math.min(currentIndex+5,queue.length),0,id);
    feedback.querySelector('.feedback-title').textContent='✗ Noch nicht richtig – die Frage kommt später erneut.';
  }
  attempted.add(id);totalAnswered++;
  feedback.querySelector('.feedback-text').textContent=q.explanation;
  document.getElementById('nextBtn').disabled=false;
  updateProgress();
}
function nextQuestion() {
  if(!locked)return;
  currentIndex++;renderCurrentQuestion();
}
function updateProgress() {
  document.getElementById('progressFill').style.width=(mastered.size/quizData.length*100)+'%';
}
function showResults() {
  document.getElementById('questionsContainer').innerHTML='';
  document.getElementById('resultsContainer').classList.add('show');
  document.getElementById('scoreNumber').textContent=Math.round(firstCorrect/quizData.length*100)+'%';
  document.getElementById('correctCount').textContent=firstCorrect+' / '+quizData.length;
  document.getElementById('incorrectCount').textContent=totalAnswered-quizData.length;
  document.getElementById('totalCount').textContent=totalAnswered;
  document.getElementById('resultMessage').textContent=firstCorrect===20?'Alles auf Anhieb richtig!':`Geschafft! Alle 20 Fragen gemeistert. ${firstCorrect} beim ersten Versuch richtig.`;
  updateProgress();
}
function restartQuiz(){initQuiz();}
window.onload=initQuiz;

</script>
</body>
