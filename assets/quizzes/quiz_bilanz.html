<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Die Bilanz – BWL Block 12</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height:100vh;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center
}
.quiz-container{
    background:#fff;
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-width:820px;
    width:100%;
    overflow:hidden
}
.quiz-header{
    background:linear-gradient(135deg,#374151 0%,#1f2937 100%);
    color:#fff;
    padding:2rem;
    text-align:center
}
.quiz-header h1{font-size:1.8rem;margin-bottom:.5rem}
.quiz-header p{opacity:.9;font-size:1rem}
.progress-bar{background:#e0e0e0;height:8px;position:relative}
.progress-fill{
    background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);
    height:100%;width:0%;transition:width .3s ease
}
.quiz-content{padding:2rem}
.question-container{display:none}
.question-container.active{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
}
.question-number{
    color:#667eea;font-weight:600;font-size:.9rem;margin-bottom:.5rem
}
.question-text{
    font-size:1.28rem;font-weight:600;color:#1f2937;
    margin-bottom:1.5rem;line-height:1.5
}
.options{display:flex;flex-direction:column;gap:1rem}
.option{
    background:#f8f9fa;border:2px solid #e0e0e0;border-radius:12px;
    padding:1rem 1.5rem;cursor:pointer;transition:all .25s ease;
    display:flex;align-items:center;gap:1rem
}
.option:focus-visible{outline:3px solid #667eea;outline-offset:3px}
.option{font:inherit;text-align:left;color:#1f2937;width:100%}
.option:hover:not(:disabled){
    background:#f0f1f3;border-color:#667eea;transform:translateX(5px)
}
.option-letter{
    background:#667eea;color:#fff;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0
}
.option.selected{background:#e8eaf6;border-color:#667eea}
.option.correct{background:#d4edda;border-color:#28a745}
.option.correct .option-letter{background:#28a745}
.option.incorrect{background:#f8d7da;border-color:#dc3545}
.option.incorrect .option-letter{background:#dc3545}
.option.disabled{cursor:not-allowed;opacity:.74}
.feedback{
    margin-top:1.5rem;padding:1rem;border-radius:8px;display:none;line-height:1.45
}
.feedback.show{display:block;animation:fadeIn .4s ease}
.feedback.correct{background:#d4edda;border-left:4px solid #28a745;color:#155724}
.feedback.incorrect{background:#f8d7da;border-left:4px solid #dc3545;color:#721c24}
.feedback-title{font-weight:700;margin-bottom:.45rem}
.controls{
    margin-top:2rem;display:flex;justify-content:space-between;gap:1rem
}
.btn{
    padding:.8rem 2rem;border:none;border-radius:8px;font-size:1rem;
    font-weight:600;cursor:pointer;transition:all .25s ease
}
.btn-primary{
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff
}
.btn-primary:hover:not(:disabled){
    transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.results-container{display:none;text-align:center;padding:2rem}
.results-container.show{display:block;animation:fadeIn .45s ease}
.score-circle{
    width:200px;height:200px;border-radius:50%;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:2rem auto;color:#fff;box-shadow:0 10px 30px rgba(102,126,234,.4)
}
.score-number{font-size:3rem;font-weight:700}
.score-label{font-size:1rem;opacity:.9}
.result-message{font-size:1.45rem;font-weight:600;color:#1f2937;margin-bottom:1rem}
.result-details{
    background:#f8f9fa;border-radius:12px;padding:1.5rem;margin:2rem 0;
    display:flex;justify-content:space-around;flex-wrap:wrap;gap:1rem
}
.result-stat{text-align:center}
.result-stat-number{font-size:2rem;font-weight:700;color:#667eea}
.result-stat-label{font-size:.9rem;color:#666;margin-top:.3rem}
.small-note{font-size:.9rem;color:#6b7280;margin-top:.8rem;line-height:1.4}
@media(max-width:768px){
    body{padding:10px}
    .quiz-header h1{font-size:1.4rem}
    .question-text{font-size:1.1rem}
    .controls{flex-direction:column}
    .btn{width:100%}
}
</style>
</head>
<body>
<div class="quiz-container">
    <div class="quiz-header">
        <h1>Die Bilanz</h1>
        <p>Inventar, Aktiva, Passiva und Eigenkapital · BWL · W-Kurs · Block 12</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="quiz-content">
        <p class="small-note" style="margin:0 0 1.2rem">20 Fragen · Jeweils eine Antwort ist richtig. Falsche Antworten kommen später erneut. Die Prozentzahl zeigt dein Ergebnis im ersten Versuch.</p>
        <div id="questionsContainer"></div>

        <div class="results-container" id="resultsContainer">
            <div class="result-message" id="resultMessage"></div>
            <div class="score-circle">
                <div class="score-number" id="scoreNumber">0%</div>
                <div class="score-label">Im ersten Versuch</div>
            </div>
            <div class="result-details">
                <div class="result-stat">
                    <div class="result-stat-number" id="correctCount">0</div>
                    <div class="result-stat-label">Gemeistert</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-number" id="incorrectCount">0</div>
                    <div class="result-stat-label">Wiederholungen</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-number" id="totalCount">0</div>
                    <div class="result-stat-label">Antworten gesamt</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 Quiz wiederholen</button>
        </div>
    </div>
</div>

<script>
const quizData = [
  {
    "question": "Was zeigt eine Bilanz?",
    "options": [
      "Vermögen und Kapital zu einem bestimmten Stichtag",
      "Alle Einnahmen und Ausgaben eines Jahres",
      "Die Stückzahlen aller einzelnen Gegenstände",
      "Nur den Gewinn des Unternehmens"
    ],
    "correct": 0,
    "explanation": "Die Bilanz stellt Vermögen und Kapital zu einem Stichtag gegenüber. Sie ist eine Momentaufnahme."
  },
  {
    "question": "Welche Veränderung führt vom Inventar zur Bilanz?",
    "options": [
      "Gleichartige Posten zusammenfassen und auf zwei Seiten anordnen",
      "Alle Vermögenswerte durch Bargeld ersetzen",
      "Nur die Schulden übernehmen und das Vermögen weglassen",
      "Die Mengen übernehmen und die Werte weglassen"
    ],
    "correct": 0,
    "explanation": "Die Bilanz verdichtet die Einzelangaben. Im Kursschema stehen Vermögen links und Kapital rechts."
  },
  {
    "question": "Welche Angaben stehen im Inventar, aber nicht als einzelne Mengenangaben in der Bilanz?",
    "options": [
      "Stückzahlen der einzelnen Gegenstände",
      "Werte der Vermögensposten in Euro",
      "Werte der Schulden in Euro",
      "Das berechnete Eigenkapital"
    ],
    "correct": 0,
    "explanation": "Das Inventar enthält Art, Menge und Wert. Die Bilanz zeigt zusammengefasste Posten mit ihren Werten."
  },
  {
    "question": "Aktiva zeigen die Mittelverwendung. Welche Frage passt dazu?",
    "options": [
      "Wofür sind die Mittel eingesetzt?",
      "Woher stammen die Mittel?",
      "Wann ist der Bankkredit zurückzuzahlen?",
      "Wie hoch ist der Gewinn des Jahres?"
    ],
    "correct": 0,
    "explanation": "Mittelverwendung fragt, worin die Mittel stecken, zum Beispiel in Maschinen, Vorräten oder Bankguthaben."
  },
  {
    "question": "Welche Zuordnung zu den Passiva ist richtig?",
    "options": [
      "Eigenkapital und Bankkredit",
      "Maschinen und Eigenkapital",
      "Bankguthaben und Kasse",
      "Rohstoffe und Lieferantenschulden"
    ],
    "correct": 0,
    "explanation": "Auf den Passiva stehen EK und FK. Der Bankkredit gehört zum Fremdkapital."
  },
  {
    "question": "Die Elster GmbH nutzt eine Maschine dauerhaft für die Fahrradproduktion. Wohin gehört sie?",
    "options": [
      "Aktiva, Anlagevermögen",
      "Aktiva, Umlaufvermögen",
      "Passiva, Eigenkapital",
      "Passiva, Fremdkapital"
    ],
    "correct": 0,
    "explanation": "Die Maschine dient dem Betrieb dauerhaft. Sie gehört deshalb zum Anlagevermögen auf der Aktivseite."
  },
  {
    "question": "Ein Fahrrad steht im Verkaufsraum und soll verkauft werden. Ein anderes nutzt die GmbH dauerhaft für Lieferfahrten. Welche Zuordnung passt?",
    "options": [
      "Verkaufsfahrrad: UV; Lieferfahrrad: AV",
      "Beide Fahrräder: AV",
      "Verkaufsfahrrad: AV; Lieferfahrrad: UV",
      "Beide Fahrräder: FK"
    ],
    "correct": 0,
    "explanation": "Die Nutzung entscheidet: Das Fahrrad zum Verkauf ist UV, das dauerhaft eingesetzte Lieferfahrrad ist AV."
  },
  {
    "question": "Ein Kunde hat ein geliefertes Fahrrad noch nicht bezahlt. Wie ordnet die GmbH die offene Kundenrechnung ein?",
    "options": [
      "Als Forderung im Umlaufvermögen",
      "Als Verbindlichkeit im Fremdkapital",
      "Als Einlage im Eigenkapital",
      "Als Maschine im Anlagevermögen"
    ],
    "correct": 0,
    "explanation": "Der Kunde schuldet der GmbH Geld. Der Zahlungsanspruch ist eine Forderung und gehört im Fall zum UV."
  },
  {
    "question": "Die GmbH hat 14.000 € Bankguthaben und einen Bankkredit von 35.000 €. Welche Zuordnung ist richtig?",
    "options": [
      "Guthaben: Aktiva; Kredit: Passiva",
      "Guthaben: Passiva; Kredit: Aktiva",
      "Beide Beträge: Aktiva",
      "Beide Beträge: Eigenkapital"
    ],
    "correct": 0,
    "explanation": "Das Guthaben ist Vermögen. Der zurückzuzahlende Kredit ist eine Schuld und damit FK."
  },
  {
    "question": "Die GmbH hat Rohstoffe erhalten, die Lieferantenrechnung aber noch nicht bezahlt. Was ist die offene Rechnung?",
    "options": [
      "Eine Lieferantenverbindlichkeit im FK",
      "Eine Kundenforderung im UV",
      "Eine Einlage im EK",
      "Ein Bankguthaben im UV"
    ],
    "correct": 0,
    "explanation": "Die GmbH schuldet dem Lieferanten Geld. Die offene Rechnung ist eine Verbindlichkeit und gehört zum FK."
  },
  {
    "question": "Ein Unternehmen hat 84.000 € Vermögen und 39.000 € Schulden. Wie hoch ist das Eigenkapital?",
    "options": [
      "45.000 €",
      "123.000 €",
      "39.000 €",
      "84.000 €"
    ],
    "correct": 0,
    "explanation": "EK = Vermögen − Schulden = 84.000 € − 39.000 € = 45.000 €."
  },
  {
    "question": "Die Aktivseite ergibt 120.000 €. Die Passivseite ergibt ebenfalls 120.000 €. Wie hoch ist die Bilanzsumme?",
    "options": [
      "120.000 €",
      "240.000 €",
      "60.000 €",
      "0 €"
    ],
    "correct": 0,
    "explanation": "Die Bilanzsumme ist die Summe einer Seite. Aktiva und Passiva werden nicht addiert."
  },
  {
    "question": "Gegeben sind: Maschinen 20.000 €, Vorräte 8.000 €, Bankguthaben 12.000 €, Kasse 4.000 € und Schulden 17.000 €. Welches Ergebnis stimmt?",
    "options": [
      "Vermögen 44.000 €; EK 27.000 €",
      "Vermögen 61.000 €; EK 44.000 €",
      "Vermögen 44.000 €; EK 61.000 €",
      "Vermögen 27.000 €; EK 10.000 €"
    ],
    "correct": 0,
    "explanation": "Vermögen = 20.000 + 8.000 + 12.000 + 4.000 = 44.000 €. EK = 44.000 − 17.000 = 27.000 €. Schulden sind kein Vermögensposten."
  },
  {
    "question": "Im Inventar stehen Maschine A mit 18.000 € und Maschine B mit 12.000 €. Wie übernimmt man sie in die einfache Bilanz?",
    "options": [
      "Maschinen: 30.000 € auf der Aktivseite",
      "Maschinen: 30.000 € auf der Passivseite",
      "Maschinen: 2 Stück auf der Aktivseite",
      "Maschinen: 18.000 € auf der Aktivseite"
    ],
    "correct": 0,
    "explanation": "Gleichartige Vermögensgegenstände werden zusammengefasst. 18.000 € + 12.000 € = 30.000 €. In der Bilanz steht der Wert."
  },
  {
    "question": "Welche Reihenfolge gilt für das Umlaufvermögen in unserem Kursschema?",
    "options": [
      "Vorräte, Forderungen, Bankguthaben, Kasse",
      "Kasse, Bankguthaben, Forderungen, Vorräte",
      "Forderungen, Maschinen, Kasse, Bankguthaben",
      "Bankkredit, Vorräte, Bankguthaben, Kasse"
    ],
    "correct": 0,
    "explanation": "Im UV ordnen wir nach zunehmender Liquidität. Bargeld steht am Ende. Maschinen sind AV, Bankkredite sind FK."
  },
  {
    "question": "Auf den Passiva stehen EK, ein Bankkredit mit fünf Jahren Laufzeit und eine Lieferantenrechnung, die in 30 Tagen fällig ist. Welche Reihenfolge passt zum Kursschema?",
    "options": [
      "EK, Bankkredit, Lieferantenverbindlichkeit",
      "Lieferantenverbindlichkeit, Bankkredit, EK",
      "Bankkredit, EK, Lieferantenverbindlichkeit",
      "EK, Lieferantenverbindlichkeit, Bankkredit"
    ],
    "correct": 0,
    "explanation": "Im Kursschema steht EK vor FK. Bei den Schulden steht der langfristige Bankkredit vor der kurzfristigen Lieferantenverbindlichkeit."
  },
  {
    "question": "Die Elster GmbH hat 90.000 € EK und 15.000 € Bankguthaben. Welche Aussage ist richtig?",
    "options": [
      "Das EK zeigt die eigene Finanzierung; auf dem Konto liegen 15.000 €",
      "Das Bankkonto enthält insgesamt 105.000 €",
      "Die GmbH kann allein aus dem Bankguthaben 90.000 € bezahlen",
      "Das EK gehört zusätzlich zu den Aktiva"
    ],
    "correct": 0,
    "explanation": "EK beschreibt die Finanzierung des gesamten Vermögens. Es ist kein zusätzliches Kontoguthaben und gehört auf die Passivseite."
  },
  {
    "question": "Eine Bilanz zum 31.12. zeigt 145.000 € Bilanzsumme. Was lässt sich daraus allein sicher sagen?",
    "options": [
      "Der Wert des bilanzierten Vermögens beträgt am Stichtag 145.000 €",
      "Der Jahresgewinn beträgt 145.000 €",
      "Auf dem Bankkonto liegen 145.000 €",
      "Das Unternehmen kann künftig alle Rechnungen bezahlen"
    ],
    "correct": 0,
    "explanation": "Die Bilanzsumme zeigt den bilanzierten Vermögenswert am Stichtag. Sie sagt allein nichts über den Jahresgewinn oder die künftige Zahlungsfähigkeit."
  },
  {
    "question": "Die Bilanzsumme beträgt 96.000 €, das Eigenkapital 58.000 €. Wie hoch ist das Fremdkapital?",
    "options": [
      "38.000 €",
      "154.000 €",
      "58.000 €",
      "96.000 €"
    ],
    "correct": 0,
    "explanation": "Vermögen = EK + FK. Deshalb ist FK = 96.000 € − 58.000 € = 38.000 €."
  },
  {
    "question": "Welches Zahlenpaar bildet eine ausgeglichene Bilanz?",
    "options": [
      "Aktiva: AV 35.000 €, UV 15.000 €; Passiva: EK 30.000 €, FK 20.000 €",
      "Aktiva: AV 35.000 €, UV 15.000 €; Passiva: EK 30.000 €, FK 15.000 €",
      "Aktiva: AV 35.000 €, UV 15.000 €; Passiva: EK 50.000 €, FK 20.000 €",
      "Aktiva: AV 35.000 €, UV 15.000 €; Passiva: EK 20.000 €, FK 20.000 €"
    ],
    "correct": 0,
    "explanation": "Aktiva: 35.000 € + 15.000 € = 50.000 €. Passiva: 30.000 € + 20.000 € = 50.000 €. Die anderen Vorschläge ergeben rechts 45.000 €, 70.000 € oder 40.000 €."
  }
];

function shuffle(items){
    const result=items.slice();
    for(let i=result.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
}
let sessionData=[];
let questionLocked=false;
let firstAttempts=new Set();
let firstCorrect=0;
let queue=[];
let currentIndex=0;
let totalAnswered=0;
let wrongSet=new Set();
let answeredCorrectly=new Set();

function initQuiz(){
    // Fünf korrekte Antworten pro Position, ohne zyklisches Muster.
    let slots;
    do {
        slots=shuffle(Array.from({length:quizData.length},(_,i)=>i%4));
    } while(slots.some((v,i)=>i>1 && v===slots[i-1] && v===slots[i-2]) ||
        slots.some((v,i)=>i>=7 && slots.slice(i-3,i+1).every((n,k)=>n===slots[i-7+k])));
    sessionData=quizData.map((q,i)=>{
        const right=q.options[q.correct];
        const options=shuffle(q.options.filter((_,j)=>j!==q.correct));
        options.splice(slots[i],0,right);
        return {...q,options,correct:slots[i]};
    });
    firstAttempts=new Set();
    firstCorrect=0;
    queue=quizData.map((_,i)=>i);
    currentIndex=0;
    totalAnswered=0;
    wrongSet=new Set();
    answeredCorrectly=new Set();
    document.getElementById("resultsContainer").classList.remove("show");
    renderCurrentQuestion();
}

function renderCurrentQuestion(){
    if(currentIndex>=queue.length){
        showResults();
        return;
    }

    const qIdx=queue[currentIndex];
    const q=sessionData[qIdx];
    questionLocked=false;
    const isRetry=wrongSet.has(qIdx);
    const container=document.getElementById("questionsContainer");

    container.innerHTML=`
    <div class="question-container active">
        <div class="question-number">
            ${isRetry ? "🔁 Wiederholung · " : ""}Frage ${totalAnswered+1} ·
            ${answeredCorrectly.size} von ${quizData.length} gemeistert
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options" id="options-current">
            ${q.options.map((opt,i)=>`
                <button type="button" class="option" onclick="selectOption(${qIdx},${i})">
                    <span class="option-letter">${String.fromCharCode(65+i)}</span>
                    <span class="option-text">${opt}</span>
                </button>
            `).join("")}
        </div>

        <div class="feedback" id="feedback-current" role="status" aria-live="polite">
            <div class="feedback-title"></div>
            <div class="feedback-text"></div>
        </div>

        <div class="controls">
            <div></div>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>
                Weiter →
            </button>
        </div>
    </div>`;

    updateProgress();
}

function selectOption(questionIndex,optionIndex){
    if(questionLocked) return;
    questionLocked=true;
    if(!firstAttempts.has(questionIndex)){
        firstAttempts.add(questionIndex);
        if(optionIndex===sessionData[questionIndex].correct) firstCorrect++;
    }
    const options=document.querySelectorAll("#options-current .option");
    const correct=sessionData[questionIndex].correct;

    options.forEach(opt=>{
        opt.classList.add("disabled");
        opt.onclick=null;
        opt.disabled=true;
    });

    options[optionIndex].classList.add("selected");
    options[optionIndex].classList.add(optionIndex===correct ? "correct" : "incorrect");
    options[correct].classList.add("correct");

    const feedback=document.getElementById("feedback-current");
    feedback.classList.add("show");

    if(optionIndex===correct){
        answeredCorrectly.add(questionIndex);
        wrongSet.delete(questionIndex);
        feedback.classList.add("correct");
        feedback.querySelector(".feedback-title").textContent="✓ Richtig!";
    }else{
        wrongSet.add(questionIndex);
        answeredCorrectly.delete(questionIndex);
        feedback.classList.add("incorrect");
        feedback.querySelector(".feedback-title").textContent="✗ Noch nicht – die Frage kommt später wieder!";
        const insertPos=Math.min(currentIndex+5,queue.length);
        queue.splice(insertPos,0,questionIndex);
    }

    feedback.querySelector(".feedback-text").innerHTML=quizData[questionIndex].explanation;
    totalAnswered++;
    document.getElementById("nextBtn").disabled=false;
    updateProgress();
}

function nextQuestion(){
    if(!questionLocked) return;
    currentIndex++;
    if(currentIndex>=queue.length) showResults();
    else renderCurrentQuestion();
}

function updateProgress(){
    const progress=(answeredCorrectly.size/quizData.length)*100;
    document.getElementById("progressFill").style.width=progress+"%";
}

function showResults(){
    document.getElementById("questionsContainer").innerHTML="";
    const results=document.getElementById("resultsContainer");
    results.classList.add("show");

    const repeats=Math.max(0,totalAnswered-quizData.length);
    const percentage=Math.round((firstCorrect/quizData.length)*100);

    document.getElementById("scoreNumber").textContent=Math.min(percentage,100)+"%";
    document.getElementById("correctCount").textContent=quizData.length;
    document.getElementById("incorrectCount").textContent=repeats;
    document.getElementById("totalCount").textContent=totalAnswered;

    let message="";
    if(repeats===0) message="Perfekt! Alles auf Anhieb richtig!";
    else if(repeats<=3) message="Sehr gut! Nur wenige Wiederholungen.";
    else if(repeats<=7) message="Gut gemacht! Die Wiederholungen haben geholfen.";
    else message="Geschafft! Wiederhole Block 12 noch einmal zur Sicherheit.";

    document.getElementById("resultMessage").textContent=message;
}

function restartQuiz(){ initQuiz(); }

window.onload=initQuiz;
</script>
</body>
</html>
