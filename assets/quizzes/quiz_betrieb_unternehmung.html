<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Betrieb und Unternehmung – BWL Block 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}
.quiz-container{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:820px;width:100%;overflow:hidden}
.quiz-header{background:linear-gradient(135deg,#374151 0%,#1f2937 100%);color:#fff;padding:2rem;text-align:center}
.quiz-header h1{font-size:1.8rem;margin-bottom:.5rem}.quiz-header p{opacity:.9;font-size:1rem}
.progress-bar{background:#e0e0e0;height:8px;position:relative}.progress-fill{background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);height:100%;width:0%;transition:width .3s ease}
.quiz-content{padding:2rem}.question-container{display:none}.question-container.active{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.question-number{color:#667eea;font-weight:600;font-size:.9rem;margin-bottom:.5rem}.question-text{font-size:1.28rem;font-weight:600;color:#1f2937;margin-bottom:1.5rem;line-height:1.5}
.options{display:flex;flex-direction:column;gap:1rem}.option{background:#f8f9fa;border:2px solid #e0e0e0;border-radius:12px;padding:1rem 1.5rem;cursor:pointer;transition:all .25s ease;display:flex;align-items:center;gap:1rem}
.option:hover{background:#f0f1f3;border-color:#667eea;transform:translateX(5px)}.option-letter{background:#667eea;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.option.selected{background:#e8eaf6;border-color:#667eea}.option.correct{background:#d4edda;border-color:#28a745}.option.correct .option-letter{background:#28a745}.option.incorrect{background:#f8d7da;border-color:#dc3545}.option.incorrect .option-letter{background:#dc3545}.option.disabled{cursor:not-allowed;opacity:.74}
.feedback{margin-top:1.5rem;padding:1rem;border-radius:8px;display:none;line-height:1.45}.feedback.show{display:block;animation:fadeIn .4s ease}.feedback.correct{background:#d4edda;border-left:4px solid #28a745;color:#155724}.feedback.incorrect{background:#f8d7da;border-left:4px solid #dc3545;color:#721c24}.feedback-title{font-weight:700;margin-bottom:.45rem}
.controls{margin-top:2rem;display:flex;justify-content:space-between;gap:1rem}.btn{padding:.8rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .25s ease}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}.btn:disabled{opacity:.5;cursor:not-allowed}
.results-container{display:none;text-align:center;padding:2rem}.results-container.show{display:block;animation:fadeIn .45s ease}.score-circle{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:2rem auto;color:#fff;box-shadow:0 10px 30px rgba(102,126,234,.4)}.score-number{font-size:3rem;font-weight:700}.score-label{font-size:1rem;opacity:.9}.result-message{font-size:1.45rem;font-weight:600;color:#1f2937;margin-bottom:1rem}.result-details{background:#f8f9fa;border-radius:12px;padding:1.5rem;margin:2rem 0;display:flex;justify-content:space-around;flex-wrap:wrap;gap:1rem}.result-stat{text-align:center}.result-stat-number{font-size:2rem;font-weight:700;color:#667eea}.result-stat-label{font-size:.9rem;color:#666;margin-top:.3rem}
@media(max-width:768px){body{padding:10px}.quiz-header h1{font-size:1.4rem}.question-text{font-size:1.1rem}.controls{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="quiz-container">
<div class="quiz-header"><h1>🏢 Betrieb und Unternehmung</h1><p>Firma, Konzern und Modelle · BWL · W-Kurs · Block 2</p></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="quiz-content">
<div id="questionsContainer"></div>
<div class="results-container" id="resultsContainer">
<div class="result-message" id="resultMessage"></div>
<div class="score-circle"><div class="score-number" id="scoreNumber">0%</div><div class="score-label">Erreicht</div></div>
<div class="result-details">
<div class="result-stat"><div class="result-stat-number" id="correctCount">0</div><div class="result-stat-label">Gemeistert</div></div>
<div class="result-stat"><div class="result-stat-number" id="incorrectCount">0</div><div class="result-stat-label">Wiederholungen</div></div>
<div class="result-stat"><div class="result-stat-number" id="totalCount">0</div><div class="result-stat-label">Antworten gesamt</div></div>
</div>
<button class="btn btn-primary" onclick="restartQuiz()">🔄 Quiz wiederholen</button>
</div></div></div>
<script>
const quizData = [
{question:"Was ist ein Betrieb?",options:["Der Name eines Kaufmanns","Eine technisch-organisatorische Einheit der Leistungserstellung","Mehrere Unternehmen unter gemeinsamer Leitung","Eine rechtlich-finanzielle Einheit"],correct:1,explanation:"Ein Betrieb ist eine technisch-organisatorische Einheit. Dort werden Menschen, Maschinen und Material kombiniert, um Güter oder Dienstleistungen zu erstellen."},
{question:"Was ist eine Unternehmung?",options:["Eine rechtlich-finanzielle Einheit","Nur ein Produktionsstandort","Der Name eines Unternehmens","Eine einzelne Maschine"],correct:0,explanation:"Die Unternehmung ist die rechtlich-finanzielle Einheit. Sie besitzt Kapital, schließt Verträge und trägt die Haftung."},
{question:"Eine GmbH besitzt ein Lager in Leipzig und ein Lager in Erfurt. Wie viele Unternehmungen und Betriebe sind das?",options:["Zwei Unternehmungen und zwei Betriebe","Zwei Unternehmungen und ein Betrieb","Eine Unternehmung und ein Betrieb","Eine Unternehmung und zwei Betriebe"],correct:3,explanation:"Die GmbH ist eine Unternehmung. Die beiden Lager sind zwei Betriebe."},
{question:"In einer Produktionshalle wird eine neue Maschine eingebaut. Worüber spricht der Satz?",options:["Über die Firma","Über die Unternehmung","Über den Betrieb","Über den Konzern"],correct:2,explanation:"Maschinen und Produktion gehören zur technisch-organisatorischen Sicht. Deshalb geht es um den Betrieb."},
{question:"Das Stammkapital einer GmbH wird erhöht. Worüber spricht der Satz?",options:["Über den Betrieb","Über die Unternehmung","Über die Firma","Über einen Standort"],correct:1,explanation:"Kapital gehört zur rechtlich-finanziellen Einheit. Deshalb geht es um die Unternehmung."},
{question:"Welche Aussage beschreibt am besten den Unterschied zwischen Betrieb und Unternehmung?",options:["Der Betrieb erstellt die Leistung; die Unternehmung trägt Kapital, Verträge und Haftung","Der Betrieb ist immer eine GmbH; die Unternehmung immer eine AG","Der Betrieb ist nur ein Name; die Unternehmung nur ein Gebäude","Es gibt fachlich keinen Unterschied"],correct:0,explanation:"Der Betrieb beschreibt die technisch-organisatorische Seite. Die Unternehmung beschreibt die rechtlich-finanzielle Seite."},
{question:"Was ist nach § 17 HGB die Firma?",options:["Die Produktionshalle","Die gesamte Belegschaft","Das Vermögen einer Gesellschaft","Der Name, unter dem ein Kaufmann seine Geschäfte betreibt"],correct:3,explanation:"Fachsprachlich ist die Firma der Name, unter dem ein Kaufmann seine Geschäfte betreibt und unterschreibt."},
{question:"Die Firma lautet „Kaya Backwaren GmbH“. Was ist damit gemeint?",options:["Der Name der Gesellschaft","Die Backstube in Leipzig","Alle Maschinen der Gesellschaft","Nur die Rechtsform GmbH"],correct:0,explanation:"Die Firma ist der vollständige Name im Geschäftsverkehr. Hier lautet sie „Kaya Backwaren GmbH“."},
{question:"Welche Aussage ist fachsprachlich richtig?",options:["Die Produktionshalle ist die Firma","Die Firma ist der Name im Geschäftsverkehr","Jeder Betrieb ist automatisch ein Konzern","Eine Firma ist immer ein Standort"],correct:1,explanation:"Die Firma bezeichnet fachsprachlich nur den Namen im Geschäftsverkehr."},
{question:"Wann liegt nach § 18 AktG ein Konzern vor?",options:["Wenn mehrere Betriebe am gleichen Ort liegen","Wenn ein Unternehmen zwei Maschinen besitzt","Wenn mehrere rechtlich selbstständige Unternehmen unter einheitlicher Leitung stehen","Wenn zwei Firmen denselben Namen verwenden"],correct:2,explanation:"Ein Konzern entsteht, wenn mehrere rechtlich selbstständige Unternehmen unter einheitlicher Leitung zusammengefasst sind."},
{question:"Zwei rechtlich selbstständige Unternehmen stehen unter einheitlicher Leitung. Bleiben sie rechtlich selbstständig?",options:["Nein, sie werden automatisch zu einem einzigen Betrieb","Nein, ihre Rechtsformen verschwinden","Nur wenn sie denselben Standort haben","Ja, die Unternehmen bleiben rechtlich selbstständig"],correct:3,explanation:"Die Unternehmen bleiben rechtlich selbstständig. Gemeinsam ist vor allem die einheitliche Leitung."},
{question:"Was ist ein Modell in der BWL?",options:["Ein vereinfachtes Abbild der Wirklichkeit","Eine vollständige Kopie der Wirklichkeit","Eine Rechtsform","Eine Produktionsstätte"],correct:0,explanation:"Ein Modell vereinfacht die Wirklichkeit, damit ein Problem übersichtlicher untersucht werden kann."},
{question:"Was bedeutet Abstraktion?",options:["Alle Informationen gleichzeitig berücksichtigen","Für die Frage unwichtige Einzelheiten bewusst weglassen","Eine Unternehmung schließen","Eine Rechtsform ändern"],correct:1,explanation:"Abstraktion bedeutet, dass unwichtige Einzelheiten bewusst weggelassen werden."},
{question:"Was ist eine Prämisse?",options:["Ein Produktionsfaktor","Ein Standort","Eine Annahme, die in einem Modell vorausgesetzt wird","Der Name eines Kaufmanns"],correct:2,explanation:"Eine Prämisse ist eine Annahme, die für ein Modell vorausgesetzt wird."},
{question:"Ein Standortmodell betrachtet nur Mietkosten, Lohnkosten und Transportkosten. Was geschieht dabei?",options:["Haftung","Konzernbildung","Firmenbildung","Abstraktion"],correct:3,explanation:"Andere Einflussfaktoren werden bewusst weggelassen. Das ist Abstraktion."},
{question:"Im Standortmodell gilt: „Die Absatzmenge ist an beiden Standorten gleich.“ Was ist diese Aussage?",options:["Eine Prämisse","Eine Firma","Ein Betrieb","Eine Rechtsform"],correct:0,explanation:"Die Aussage wird im Modell vorausgesetzt. Deshalb ist sie eine Prämisse."},
{question:"Warum kann ein vereinfachtes Modell nützlich sein?",options:["Weil es jede Einzelheit der Wirklichkeit enthält","Weil es komplexe Probleme übersichtlicher und untersuchbar macht","Weil es immer garantiert die richtige Entscheidung liefert","Weil es keine Annahmen benötigt"],correct:1,explanation:"Modelle reduzieren Komplexität. Dadurch können wirtschaftliche Probleme leichter untersucht und verglichen werden."},
{question:"Was ist der homo oeconomicus in diesem Block?",options:["Eine Rechtsform","Ein realer Unternehmer","Eine vereinfachte Modellfigur für wirtschaftliche Entscheidungen","Ein Produktionsfaktor"],correct:2,explanation:"Der homo oeconomicus ist eine Modellfigur. Er dient als vereinfachte Darstellung wirtschaftlichen Entscheidungsverhaltens."},
{question:"Welche Aussage passt zum einfachen Modell des homo oeconomicus?",options:["Er entscheidet immer zufällig","Er kennt grundsätzlich keine Informationen","Er handelt nur nach Gefühlen","Er entscheidet rational und orientiert sich an seinem Vorteil"],correct:3,explanation:"Im einfachen Modell entscheidet der homo oeconomicus rational und orientiert sich am eigenen Vorteil."},
{question:"Warum ist der homo oeconomicus keine Beschreibung eines echten Menschen?",options:["Weil reale Menschen nicht immer alle Informationen besitzen und nicht immer vollständig rational entscheiden","Weil Menschen niemals wirtschaftlich entscheiden","Weil nur Unternehmen rational handeln können","Weil Modelle keine Vereinfachungen enthalten dürfen"],correct:0,explanation:"Reale Menschen haben begrenzte Informationen und entscheiden nicht immer vollständig rational. Deshalb ist der homo oeconomicus eine vereinfachte Modellfigur."}
];
let queue=[],currentIndex=0,totalAnswered=0,wrongSet=new Set(),answeredCorrectly=new Set();
function initQuiz(){queue=quizData.map((_,i)=>i);currentIndex=0;totalAnswered=0;wrongSet=new Set();answeredCorrectly=new Set();document.getElementById("resultsContainer").classList.remove("show");renderCurrentQuestion();}
function renderCurrentQuestion(){if(currentIndex>=queue.length){showResults();return;}const qIdx=queue[currentIndex],q=quizData[qIdx],isRetry=wrongSet.has(qIdx),container=document.getElementById("questionsContainer");container.innerHTML=`<div class="question-container active"><div class="question-number">${isRetry ? "🔁 Wiederholung · " : ""}Frage ${totalAnswered+1} · ${answeredCorrectly.size} von ${quizData.length} gemeistert</div><div class="question-text">${q.question}</div><div class="options" id="options-current">${q.options.map((opt,i)=>`<div class="option" onclick="selectOption(${qIdx},${i})"><div class="option-letter">${String.fromCharCode(65+i)}</div><div class="option-text">${opt}</div></div>`).join("")}</div><div class="feedback" id="feedback-current"><div class="feedback-title"></div><div class="feedback-text"></div></div><div class="controls"><div></div><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Weiter →</button></div></div>`;updateProgress();}
function selectOption(questionIndex,optionIndex){const options=document.querySelectorAll("#options-current .option"),correct=quizData[questionIndex].correct;options.forEach(opt=>{opt.classList.add("disabled");opt.onclick=null;});options[optionIndex].classList.add("selected");options[optionIndex].classList.add(optionIndex===correct ? "correct" : "incorrect");options[correct].classList.add("correct");const feedback=document.getElementById("feedback-current");feedback.classList.add("show");if(optionIndex===correct){answeredCorrectly.add(questionIndex);wrongSet.delete(questionIndex);feedback.classList.add("correct");feedback.querySelector(".feedback-title").textContent="✓ Richtig!";}else{wrongSet.add(questionIndex);answeredCorrectly.delete(questionIndex);feedback.classList.add("incorrect");feedback.querySelector(".feedback-title").textContent="✗ Noch nicht – die Frage kommt später wieder!";const insertPos=Math.min(currentIndex+5,queue.length);queue.splice(insertPos,0,questionIndex);}feedback.querySelector(".feedback-text").innerHTML=quizData[questionIndex].explanation;totalAnswered++;document.getElementById("nextBtn").disabled=false;updateProgress();}
function nextQuestion(){currentIndex++;if(currentIndex>=queue.length)showResults();else renderCurrentQuestion();}
function updateProgress(){const progress=(answeredCorrectly.size/quizData.length)*100;document.getElementById("progressFill").style.width=progress+"%";}
function showResults(){document.getElementById("questionsContainer").innerHTML="";const results=document.getElementById("resultsContainer");results.classList.add("show");const repeats=Math.max(0,totalAnswered-quizData.length),percentage=Math.round((quizData.length/Math.max(totalAnswered,quizData.length))*100);document.getElementById("scoreNumber").textContent=Math.min(percentage,100)+"%";document.getElementById("correctCount").textContent=quizData.length;document.getElementById("incorrectCount").textContent=repeats;document.getElementById("totalCount").textContent=totalAnswered;let message="";if(repeats===0)message="Perfekt! Alles auf Anhieb richtig!";else if(repeats<=3)message="Sehr gut! Nur wenige Wiederholungen.";else if(repeats<=7)message="Gut gemacht! Die Wiederholungen haben geholfen.";else message="Geschafft! Wiederhole Block 2 noch einmal zur Sicherheit.";document.getElementById("resultMessage").textContent=message;}
function restartQuiz(){initQuiz();}
window.onload=initQuiz;
</script>
</body>
</html>
