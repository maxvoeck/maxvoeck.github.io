<html lang="de">
<head>

<title>Quiz: Unternehmensziele und Zielbeziehungen – BWL Block 5</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;

    display:flex;
    justify-content:center;

}

.quiz-container{

.quiz-header{

    padding:2rem;

}

.quiz-header h1{

}

.quiz-header p{

    font-size:1rem;
    line-height:1.4
}

.progress-bar{
    background:#e0e0e0;
    height:8px;
    position:relative
}

.progress-fill{
    background:linear-gradient(90deg,#667eea 0%,#764ba2 100%);
    height:100%;
    width:0%;
    transition:width .3s ease
}

.quiz-content{
    padding:2rem
}

.question-container{
    display:none
}

.question-container.active{
    display:block;
    animation:fadeIn .45s ease
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(18px)
    }
    to{
        opacity:1;
        transform:translateY(0)
    }
}

.question-number{
    color:#667eea;
    font-weight:600;
    font-size:.9rem;
    margin-bottom:.5rem
}

.question-text{
    font-size:1.28rem;
    font-weight:600;
    color:#1f2937;
    margin-bottom:1.5rem;
    line-height:1.5
}

.options{
    display:flex;
    flex-direction:column;
    gap:1rem
}

.option{
    background:#f8f9fa;
    border:2px solid #e0e0e0;
    border-radius:12px;
    padding:1rem 1.5rem;
    cursor:pointer;
    transition:all .25s ease;
    display:flex;
    align-items:center;
    gap:1rem
}

.option:hover{
    background:#f0f1f3;
    border-color:#667eea;
    transform:translateX(5px)
}

.option-letter{
    background:#667eea;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    flex-shrink:0
}

.option-text{
    line-height:1.4
}

.option.selected{
    background:#e8eaf6;
    border-color:#667eea
}

.option.correct{
    background:#d4edda;
    border-color:#28a745
}

.option.correct .option-letter{
    background:#28a745
}

.option.incorrect{
    background:#f8d7da;
    border-color:#dc3545
}

.option.incorrect .option-letter{
    background:#dc3545
}

.option.disabled{
    cursor:not-allowed;
    opacity:.74
}

.feedback{
    margin-top:1.5rem;
    padding:1rem;
    border-radius:8px;
    display:none;
    line-height:1.5
}

.feedback.show{
    display:block;
    animation:fadeIn .4s ease
}

.feedback.correct{
    background:#d4edda;
    border-left:4px solid #28a745;
    color:#155724
}

.feedback.incorrect{
    background:#f8d7da;
    border-left:4px solid #dc3545;
    color:#721c24
}

.feedback-title{
    font-weight:700;
    margin-bottom:.45rem
}

.controls{
    margin-top:2rem;
    display:flex;
    justify-content:space-between;
    gap:1rem

.btn{
    padding:.8rem 2rem;
    border:none;
    border-radius:8px;
    font-size:1rem;
    font-weight:600;

.btn-primary{

.btn-primary:hover:not(:disabled){

}

.btn:disabled{

.results-container{

    text-align:center;
    padding:2rem

.results-container.show{

.score-circle{

.score-number{

    font-weight:700

.score-label{
    font-size:1rem;

.result-message{

    font-weight:600;
    color:#1f2937;
    margin-bottom:1rem

.result-details{

.result-stat{

.result-stat-number{

.result-stat-label{

    }

</style>
</head>

let queue=[];
let currentIndex=0;
let totalAnswered=0;
let wrongSet=new Set();
let answeredCorrectly=new Set();

function initQuiz(){

    queue=quizData.map((_,i)=>i);

    currentIndex=0;
    totalAnswered=0;

    wrongSet=new Set();
    answeredCorrectly=new Set();

    document
        .getElementById("resultsContainer")
        .classList.remove("show");

    renderCurrentQuestion();
}

function renderCurrentQuestion(){

    if(currentIndex>=queue.length){
        showResults();
        return;
    }

    const qIdx=queue[currentIndex];
    const q=quizData[qIdx];

    const isRetry=wrongSet.has(qIdx);

    const container=
        document.getElementById("questionsContainer");

    container.innerHTML=`
    <div class="question-container active">

        <div class="question-number">
            ${isRetry ? "🔁 Wiederholung · " : ""}
            Frage ${totalAnswered+1} ·
            ${answeredCorrectly.size} von ${quizData.length} gemeistert
        </div>

        <div class="question-text">
            ${q.question}
        </div>

        <div class="options" id="options-current">

            ${q.options.map((opt,i)=>`
                <div
                    class="option"
                    onclick="selectOption(${qIdx},${i})"
                >
                    <div class="option-letter">
                        ${String.fromCharCode(65+i)}
                    </div>

                    <div class="option-text">
                        ${opt}
                    </div>
                </div>
            `).join("")}

        </div>

        <div
            class="feedback"
            id="feedback-current"
        >
            <div class="feedback-title"></div>
            <div class="feedback-text"></div>
        </div>

        <div class="controls">

            <div></div>

            <button
                class="btn btn-primary"
                id="nextBtn"
                onclick="nextQuestion()"
                disabled
            >
                Weiter →
            </button>

        </div>

    </div>
    `;

    updateProgress();
}

function selectOption(questionIndex,optionIndex){

    const options=
        document.querySelectorAll(
            "#options-current .option"
        );

    const correct=
        quizData[questionIndex].correct;

    options.forEach(opt=>{
        opt.classList.add("disabled");
        opt.onclick=null;
    });

    options[optionIndex]
        .classList.add("selected");

    options[optionIndex]
        .classList.add(
            optionIndex===correct
            ? "correct"
            : "incorrect"
        );

    options[correct]
        .classList.add("correct");

    const feedback=
        document.getElementById(
            "feedback-current"
        );

    feedback.classList.add("show");

    if(optionIndex===correct){

        answeredCorrectly.add(questionIndex);
        wrongSet.delete(questionIndex);

        feedback.classList.add("correct");

        feedback
            .querySelector(".feedback-title")
            .textContent="✓ Richtig!";

    }else{

        wrongSet.add(questionIndex);
        answeredCorrectly.delete(questionIndex);

        feedback.classList.add("incorrect");

        feedback
            .querySelector(".feedback-title")
            .textContent=
            "✗ Noch nicht – die Frage kommt später wieder!";

        const insertPos=
            Math.min(
                currentIndex+5,
                queue.length
            );

        queue.splice(
            insertPos,
            0,
            questionIndex
        );
    }

    feedback
        .querySelector(".feedback-text")
        .innerHTML=
        quizData[questionIndex].explanation;

    totalAnswered++;

    document
        .getElementById("nextBtn")
        .disabled=false;

    updateProgress();
}

function nextQuestion(){

    currentIndex++;

    if(currentIndex>=queue.length){
        showResults();
    }else{
        renderCurrentQuestion();
    }
}

function updateProgress(){

    const progress=
        (
            answeredCorrectly.size
            /
            quizData.length
        )*100;

    document
        .getElementById("progressFill")
        .style.width=
        progress+"%";
}

function showResults(){

    document
        .getElementById("questionsContainer")
        .innerHTML="";

    const results=
        document.getElementById(
            "resultsContainer"
        );

    results.classList.add("show");

    const repeats=
        Math.max(
            0,
            totalAnswered-quizData.length
        );

    const percentage=
        Math.round(
            (
                quizData.length
                /
                Math.max(
                    totalAnswered,
                    quizData.length
                )
            )*100
        );

    document
        .getElementById("scoreNumber")
        .textContent=
        Math.min(percentage,100)+"%";

    document
        .getElementById("correctCount")
        .textContent=
        quizData.length;

    document
        .getElementById("incorrectCount")
        .textContent=
        repeats;

    document
        .getElementById("totalCount")
        .textContent=
        totalAnswered;

    let message="";

    if(repeats===0){
        message=
            "Perfekt! Alles auf Anhieb richtig!";
    }
    else if(repeats<=4){
        message=
            "Sehr gut! Nur wenige Wiederholungen.";
    }
    else if(repeats<=9){
        message=
            "Gut gemacht! Die Wiederholungen haben geholfen.";
    }
    else{
        message=
            "Geschafft! Wiederhole Block 5 noch einmal zur Sicherheit.";
    }

    document
        .getElementById("resultMessage")
        .textContent=
        message;
}

function restartQuiz(){
    initQuiz();
}

window.onload=initQuiz;

</script>

</body>
</html>
