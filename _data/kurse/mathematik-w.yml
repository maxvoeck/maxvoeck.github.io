# Moduldaten Mathematik W-Kurs (2. Semester).
# fortschritt: false in allen Kapiteln — diese Seite hatte noch nie Häkchen.

fortschritt_key: mathe-w-progress

kapitel:
  - numeral: I
    titel: Lineare Algebra
    fortschritt: false
    module:
      - id: a1
        nr: "01"
        titel: Matrizen — Grundbegriffe
        desc: >-
          Definition, Typ, spezielle Matrizen (Diagonal-, Dreiecks-, symmetrische Matrix), Gleichheit, Addition, Skalarmultiplikation, Matrizenmultiplikation, Transponierte, Inverse und Spur
        pdf: /assets/pdfs/W_Matrizen_1.pdf
        quiz: /assets/quizzes/quiz_matrizen_w_grundbegriffe.html
        text: /assets/texte/w-matrizen-1.pdf
      - id: a2
        nr: "02"
        titel: Determinante und inverse Matrix
        desc: >-
          Determinante bei 1×1-, 2×2- und 3×3-Matrizen (Regel von Sarrus), Laplacescher Entwicklungssatz, Eigenschaften der Determinante, Inverse mit der Adjunkten-Methode und Rechenregeln
        pdf: /assets/pdfs/W_Matrizen_2.pdf
        quiz: /assets/quizzes/quiz_matrizen_w_determinante.html
        text: /assets/texte/w-matrizen-2.pdf
      - id: a3
        nr: "03"
        titel: Matrizengleichungen
        desc: >-
          Gleichungstypen X+A=B, AX=B, XA=B, AXB=C, AXᵀ=B und AᵀX+B=C nach X auflösen, allgemeine Lösungsstrategie und wichtige Regeln im Überblick
        pdf: /assets/pdfs/W_Matrizen_3.pdf
        quiz: /assets/quizzes/quiz_matrizen_w_gleichungen.html
        text: /assets/texte/w-matrizen-3.pdf
      - id: a4
        nr: "04"
        titel: Lineare Gleichungssysteme
        desc: >-
          Erweiterte Koeffizientenmatrix, Gauß-Algorithmus und Zeilenstufenform, Rang einer Matrix, Lösbarkeitskriterien (keine, genau eine, unendlich viele Lösungen) und Rückwärtseinsetzen
        pdf: /assets/pdfs/W_LGS_1.pdf
        quiz: /assets/quizzes/quiz_matrizen_w_lgs.html
        text: /assets/texte/w-lgs-1.pdf
      - id: a5
        nr: "05"
        titel: LGS mit Parameter
        desc: >-
          Parameter auf der rechten Seite, in der Koeffizientenmatrix und an mehreren Stellen; Fallunterscheidung bei parameterabhängigen Pivot-Elementen und Bestimmung der Lösungsmenge in Abhängigkeit vom Parameter
        pdf: /assets/pdfs/W_LGS_2.pdf
        quiz: /assets/quizzes/quiz_matrizen_w_lgs_parameter.html
        text: /assets/texte/w-lgs-2.pdf

  - numeral: II
    titel: Finanzmathematik
    fortschritt: false
    module:
      - id: f1
        nr: "01"
        titel: Prozent- und Zinsrechnung
        desc: >-
          Grundbegriffe Grundwert, Prozentsatz, Prozentwert und das Prozent-Dreieck, die drei Grundaufgaben der Prozentrechnung sowie Zinsen für Jahre, Monate und Tage (kaufmännische Zinsrechnung)
        pdf: /assets/pdfs/W_Zinsrechnung_1.pdf
        quiz: /assets/quizzes/quiz_finanzmathematik_w_zinsrechnung.html
        text: /assets/texte/w-zinsrechnung-1.pdf
      - id: f2
        nr: "02"
        titel: Zinseszinsrechnung
        desc: >-
          Wachstumsfaktor q, Herleitung und Anwendung der Zinseszinsformel Kn = K0·qⁿ, Auf- und Abzinsen (Barwert), gesuchter Zinssatz und gesuchte Laufzeit über den Logarithmus sowie Vergleich mit einfacher Verzinsung
        pdf: /assets/pdfs/W_Zinseszins_1.pdf
        text: /assets/texte/w-zinseszins-1.pdf

  - numeral: III
    titel: Differentialrechnung
    meta: folgt
    fortschritt: false
    module: []

  - numeral: IV
    titel: Integralrechnung
    meta: folgt
    fortschritt: false
    module: []
