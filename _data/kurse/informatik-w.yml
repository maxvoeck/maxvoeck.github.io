# Moduldaten Informatik W-Kurs (1. Semester).
# Neue Module hier eintragen — Modulzahlen werden automatisch berechnet.
# Optionale Felder je Modul: desc, quiz, podcast, text

fortschritt_key: info-w-progress

kapitel:
  - numeral: I
    titel: Informatik
    ueberschrift: false
    module:
      - id: w1
        nr: "01"
        titel: "Was braucht eine Kasse? – Daten, Information, Hardware und Software"
        desc: >-
          Am Beispiel einer Café-Kasse: Daten als dargestellte Angaben, Information aus Daten im
          Zusammenhang, Hardware und Software unterscheiden und begründen, welche Daten für eine
          bestimmte Frage gebraucht werden
        pdf: /assets/pdfs/Info_W_1.pdf
        quiz: /assets/quizzes/quiz_informatik_w_block1.html
        text: /assets/texte/info-w-1.pdf
      - id: w1-2
        nr: "02"
        titel: "Wie viel Platz braucht das? – Speicherung, Bit und Byte"
        desc: >-
          Am Verkaufsarchiv der Elster-Kasse: warum Computer mit zwei Zuständen arbeiten, Bits zu
          Mustern kombinieren, vom Bit zum Byte, Speichereinheiten von Byte bis Terabyte umrechnen
          und den Speicherbedarf für Verkäufe und Kopien berechnen
        pdf: /assets/pdfs/Info_W_1_2.pdf
      - id: w2-1
        nr: "03"
        titel: "Wie schreibt ein Computer Zahlen? – Das Binärsystem"
        desc: >-
          An Elsters Lagerbeständen: Binärzahlen mit Stellenwerten in Dezimalzahlen umrechnen,
          Dezimalzahlen mit dem Divisionsverfahren ins Binärsystem übertragen und bestimmen,
          welche Bestände sich mit einer gegebenen Anzahl Bits darstellen lassen
        pdf: /assets/pdfs/Info_W_2_1.pdf
        quiz: /assets/quizzes/quiz_informatik_w_block2_1.html
        text: /assets/texte/info-w-2-1.pdf
      - id: w2-2
        nr: "04"
        titel: "Wie rechnet und schreibt die Kasse? – Binäre Addition und ASCII"
        desc: >-
          An Elsters Lieferungen und Produktnamen: Binärzahlen schriftlich mit Übertrag addieren,
          erkennen, wann ein Ergebnis mehr Bits braucht, und Zeichen mit der ASCII-Tabelle in Bytes
          codieren und wieder decodieren
        pdf: /assets/pdfs/Info_W_2_2.pdf
        quiz: /assets/quizzes/quiz_informatik_w_block2_2.html
        text: /assets/texte/info-w-2-2.pdf
      - id: w3-1
        nr: "05"
        titel: "Wer zahlt den Versand? – Aussagen und Logik"
        desc: >-
          An Elsters Versandregel: Aussagen von Fragen und Aufforderungen unterscheiden, Aussagen mit
          UND (∧), ODER (∨) und NICHT (¬) verknüpfen, Wahrheitstabellen vollständig ergänzen und
          Ergebnisse wie Versandkosten mit Grenzfällen begründen
        pdf: /assets/pdfs/Info_W_3_1.pdf
        quiz: /assets/quizzes/quiz_informatik_w_block3_1.html
        text: /assets/texte/info-w-3-1.pdf
      - id: w3-2
        nr: "06"
        titel: "Was ergibt der Ausdruck? – Logische Ausdrücke auswerten"
        desc: >-
          Ausdrücke mit zwei und drei Variablen Schritt für Schritt auswerten, die Wirkung von
          Klammern erkennen, Wahrheitstabellen ergänzen, passende Belegungen finden und prüfen,
          ob zwei Ausdrücke gleichwertig sind
        pdf: /assets/pdfs/Info_W_3_2.pdf
      - id: w4-1
        nr: "07"
        titel: "Wie wird aus einer Idee ein Ablauf? – Algorithmen"
        desc: >-
          Am Kino-Ticketautomaten: was einen Algorithmus ausführbar macht, das EVA-Prinzip,
          Variablen und Zuweisungen, Ein- und Ausgabe und die Reihenfolge der Anweisungen im
          Struktogramm
        pdf: /assets/pdfs/Info_W_4_1.pdf
